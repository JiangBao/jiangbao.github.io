<button class=nav-icon type=button data-theme-toggle aria-label=切换暗黑主题 title=切换主题><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5.0 018.7 3.8a8.6 8.6.0 1011.5 11.5z"/></svg></button></nav></header><main id=main><article class=single-article><header class="article-header shell"><div class=article-header-inner><h1>记录一棵洒金的成长</h1><div class=article-meta><time datetime=2025-03-16>2025 年 03 月 16 日</time></div></div></header><div class="article-content shell"><div class="article-prose prose"><p>去年入秋前买了棵洒金龟背竹小苗，入冬前长了一片未开背的新叶后，便一直僵住了。期间看了不少诸如「买到组培失败的苗，洒金永远不会开背」之类的文章，一度怀疑它应该也只能当成大叶绿萝来养了 😂。<br>结果春节回来后，发现它已经憋了一个小芽，在杭州湿冷的春季，偶尔一个有阳光的晴天，它居然开出了第一片开背的叶子，喜出望外，给它留下记录。</p><div class="image-gallery image-gallery-2 image-gallery-ratio-auto image-gallery-layout-grid" role=group aria-label=刚到家与换盆后的洒金><figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin01.jpg data-lightbox-alt=刚到家的小苗 aria-label=放大图片：刚到家的小苗><img fetchpriority=low src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin01.jpg alt=刚到家的小苗 loading=lazy decoding=async style=width:400px></button><figcaption>刚到家的小苗</figcaption></figure><figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin02.jpg data-lightbox-alt=缓苗一周后换了盆 aria-label=放大图片：缓苗一周后换了盆><img fetchpriority=low src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin02.jpg alt=缓苗一周后换了盆 loading=lazy decoding=async style=width:400px></button><figcaption>缓苗一周后换了盆</figcaption></figure></div><div class="image-gallery image-gallery-2 image-gallery-ratio-auto image-gallery-layout-grid" role=group aria-label=从第一片新叶到第一次开背><figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin03.jpg data-lightbox-alt=到家后第一片新叶 aria-label=放大图片：到家后第一片新叶><img fetchpriority=low src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin03.jpg alt=到家后第一片新叶 loading=lazy decoding=async style=width:400px></button><figcaption>到家后第一片新叶</figcaption></figure><figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin04.jpg data-lightbox-alt=第一片开背的叶子，圆圆的脑袋 aria-label=放大图片：第一片开背的叶子，圆圆的脑袋><img fetchpriority=low src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin04.jpg alt=第一片开背的叶子，圆圆的脑袋 loading=lazy decoding=async style=width:400px></button><figcaption>第一片开背的叶子，圆圆的脑袋</figcaption></figure></div><figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin05.jpg data-lightbox-alt=第二片正常开背的叶子 aria-label=放大图片：第二片正常开背的叶子><img fetchpriority=low src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/sajin05.jpg alt=第二片正常开背的叶子 loading=lazy decoding=async></button><figcaption>第二片正常开背的叶子</figcaption></figure></div></div><footer class="article-footer shell"><a class=article-end href=/posts/>← 文章</a><nav class=article-tags aria-label=文章标签><a href=/tags/%E7%94%9F%E6%B4%BB/># 生活</a></nav></footer></article></main><footer class="site-footer shell"><span>© 2026 酱鲍</span></footer><dialog class=search-dialog data-search-dialog data-index-url=/index.json aria-label=搜索文章><div class=search-panel><div class=search-heading><strong>搜索</strong><button type=button data-search-close aria-label=关闭搜索>×</button></div><input type=search data-search-input placeholder=搜索文章、随记或标签 autocomplete=off aria-label=搜索关键词><div class=search-results data-search-results aria-live=polite><p class=search-message>输入关键词开始搜索。</p></div></div></dialog><script defer src=/js/site.min.c597f99a5e7f409496bacc997923d83ccefb910cf9a6afa22343d993b2e8acdf.js integrity="sha256-xZf5ml5/QJSWusyZeSPYPM77kQz5pq+iI0PZk7LorN8="></script></body></html>
