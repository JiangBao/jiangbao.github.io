<button class=nav-icon type=button data-theme-toggle aria-label=切换暗黑主题 title=切换主题><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5.0 018.7 3.8a8.6 8.6.0 1011.5 11.5z"/></svg></button></nav></header><main id=main><article class=single-article><header class="article-header shell"><div class=article-header-inner><h1>特种兵旅行</h1><div class=article-meta><time datetime=2023-04-15>2023 年 04 月 15 日</time></div></div></header><div class="article-content shell"><div class="article-prose prose"><figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041501.jpg data-lightbox-alt="2023.04.15 黄山之行" aria-label="放大图片：2023.04.15 黄山之行"><img loading=eager fetchpriority=high src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041501.jpg alt="2023.04.15 黄山之行" decoding=async></button><figcaption>2023.04.15 黄山之行</figcaption></figure><p>缘起于前几日聊天时朋友的一时兴起，虽然也曾担心这个旺季山上人过多，但还是约上五人，饶有兴致地出发了。</p><p>一大早上山，感觉并没有想象中的人山人海，然后随着人流高峰到来，我们在这样人挤人的山路上至少蠕行了 4 个小时&mldr;<figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041505.jpg data-lightbox-alt=文章配图 aria-label=放大图片：文章配图><img fetchpriority=low src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041505.jpg alt=文章配图 loading=lazy decoding=async></button></figure></p><blockquote><p>结论：<br>运气很好，有云海，很漂亮<br>人很多，慎重前往&mldr;<br>如果是对的人，那就别有顾虑，尽管开启特种兵似的爬山之旅吧~</p></blockquote><p><div class="image-gallery image-gallery-2 image-gallery-ratio-portrait image-gallery-layout-grid" role=group aria-label=图片组><figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041502.jpg data-lightbox-alt=半山大雾，宛如水墨画 aria-label=放大图片：半山大雾，宛如水墨画><img fetchpriority=low src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041502.jpg alt=半山大雾，宛如水墨画 loading=lazy decoding=async style=width:400px></button><figcaption>半山大雾，宛如水墨画</figcaption></figure><figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041503.jpg data-lightbox-alt=光明顶俯瞰，大好河山 aria-label=放大图片：光明顶俯瞰，大好河山><img fetchpriority=low src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041503.jpg alt=光明顶俯瞰，大好河山 loading=lazy decoding=async style=width:400px></button><figcaption>光明顶俯瞰，大好河山</figcaption></figure></div><figure class=content-figure><button type=button class=figure-open data-lightbox-src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041504.jpg data-lightbox-alt="欢迎再来黄山 🐶" aria-label="放大图片：欢迎再来黄山 🐶"><img fetchpriority=low src=https://jiangbao-1258001083.cos.ap-shanghai.myqcloud.com/2023041504.jpg alt="欢迎再来黄山 🐶" loading=lazy decoding=async style=width:800px></button><figcaption>欢迎再来黄山 🐶</figcaption></figure></p></div></div><footer class="article-footer shell"><a class=article-end href=/posts/>← 文章</a><nav class=article-tags aria-label=文章标签><a href=/tags/%E7%94%9F%E6%B4%BB/># 生活</a></nav></footer></article></main><footer class="site-footer shell"><span>© 2026 酱鲍</span></footer><dialog class=search-dialog data-search-dialog data-index-url=/index.json aria-label=搜索文章><div class=search-panel><div class=search-heading><strong>搜索</strong><button type=button data-search-close aria-label=关闭搜索>×</button></div><input type=search data-search-input placeholder=搜索文章、随记或标签 autocomplete=off aria-label=搜索关键词><div class=search-results data-search-results aria-live=polite><p class=search-message>输入关键词开始搜索。</p></div></div></dialog><script defer src=/js/site.min.c597f99a5e7f409496bacc997923d83ccefb910cf9a6afa22343d993b2e8acdf.js integrity="sha256-xZf5ml5/QJSWusyZeSPYPM77kQz5pq+iI0PZk7LorN8="></script></body></html>
